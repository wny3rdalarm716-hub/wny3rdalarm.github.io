
name: Update Live Incidents

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and filter Active911 incidents
        env:
          RSS_URL: ${{ secrets.ACTIVE911_RSS_URL }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime

          url = os.environ["RSS_URL"]

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "WNY3A-Feed/1.0"}
          )

          with urllib.request.urlopen(req, timeout=20) as response:
              xml = response.read()

          root = ET.fromstring(xml)
          incidents = []

          for item in root.findall("./channel/item")[:30]:
              title = (item.findtext("title") or "").strip()
              date = (item.findtext("pubDate") or "").strip()

              if not title:
                  continue

              # Remove possible street addresses.
              title = re.sub(
                  r"\b\d{1,5}\s+\S+.*",
                  "",
                  title
              ).strip()

              if not title:
                  title = "Incident"

              try:
                  timestamp = parsedate_to_datetime(
                      date
                  ).isoformat()
              except (ValueError, TypeError):
                  continue

              incidents.append({
                  "type": title[:80],
                  "area": "Western New York",
                  "time": timestamp
              })

          with open("incidents.json", "w") as file:
              json.dump(incidents, file, indent=2)

          print(f"Updated {len(incidents)} incidents.")
          PY

      - name: Publish updated incident data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add incidents.json

          if ! git diff --cached --quiet; then
            git commit -m "Update public incident feed"
            git push
          fi
