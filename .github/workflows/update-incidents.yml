
name: Test Active911 API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Active911 connection
        env:
          ACTIVE911_REFRESH_TOKEN: ${{ secrets.ACTIVE911_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request

          refresh_url = (
              "https://console.active911.com"
              "/interface/dev/api_access.php"
          )

          data = urllib.parse.urlencode({
              "refresh_token": os.environ["ACTIVE911_REFRESH_TOKEN"]
          }).encode()

          req = urllib.request.Request(
              refresh_url,
              data=data,
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=20) as r:
              token_data = json.load(r)

          access_token = token_data["access_token"]

          api_url = (
              "https://access.active911.com"
              "/interface/open_api/api/"
          )

          req = urllib.request.Request(
              api_url,
              headers={
                  "Authorization": f"Bearer {access_token}"
              }
          )

          with urllib.request.urlopen(req, timeout=20) as r:
              result = json.load(r)

          if result.get("result") == "success":
              print("SUCCESS: Active911 API connected!")
          else:
              print("API connection was not successful.")
              raise SystemExit(1)
          PY
